product:
  type: kmp/lib
  platforms: [ android, iosArm64, iosSimulatorArm64, wasmJs ]

dependencies:
  - //core
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.ktor.client.core
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.serialization.kotlinx.json
  # kotlinx.coroutines is provided by Ktor dependencies

dependencies@android:
  - $compose.uiTooling
  - $libs.ktor.client.android

dependencies@iosArm64:
  - $libs.ktor.client.darwin

dependencies@iosSimulatorArm64:
  - $libs.ktor.client.darwin

dependencies@wasmJs:
  - $libs.ktor.client.js

settings:
  kotlin:
    serialization:
      enabled: true
  compose:
    enabled: true
    resources:
      packageName: com.example.lauzhack26_multiplatform.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin:
    serialization:
      enabled: true
